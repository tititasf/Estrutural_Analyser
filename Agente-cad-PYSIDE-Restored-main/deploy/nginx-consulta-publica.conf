    location /consulta-api/ {
        # O frontend já inclui /api/v1; removemos somente /consulta-api/.
        proxy_pass http://127.0.0.1:21390/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /consulta/ {
        proxy_pass http://127.0.0.1:21391/consulta/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
