}

}

function highlightSidebar(pnum,svg){
  document.querySelectorAll('.pg').forEach(function(el){
    var isActive=parseInt(el.dataset.pnum)===pnum;
    el.classList.toggle('active', isActive);
    if(isActive) el.classList.add('open');
  });
  document.querySelectorAll('.item').forEach(function(el){
    el.classList.toggle('active', el.dataset.svg===svg);
  });
  var activeEl = document.querySelector('.item.active') || document.querySelector('.pg.active');
  if(activeEl) activeEl.scrollIntoView({block:'nearest'});
}

function buildSidebar(){
  var nl = document.getElementById('navlist');
  nl.innerHTML='';
  NAV.forEach(function(p,pi){
    var idx_page = flatItems.findIndex(function(f){return f.pnum===p.pnum&&f.type==='page';});
    var div = document.createElement('div');
    div.className='pg'; div.dataset.pnum=p.pnum;

    var plabel = document.createElement('div');
    plabel.className='plabel';
    plabel.textContent=p.label+(p.items.length?' ('+p.items.length+')':' --');
    plabel.onclick=function(){
      div.classList.toggle('open');
      if(idx_page>=0) loadItem(p.page_svg,p.pnum,p.label,idx_page);
    };
    div.appendChild(plabel);

    if(p.items.length){
      var idiv = document.createElement('div');
      idiv.className='items';
      p.items.forEach(function(it){
        var idx_it = flatItems.findIndex(function(f){return f.svg===it.svg;});
        var sp=document.createElement('div');
        sp.className='item'; sp.dataset.svg=it.svg;
        sp.textContent=it.name;
        sp.onclick=function(e){e.stopPropagation();loadItem(it.svg,p.pnum,it.name,idx_it);};
        idiv.appendChild(sp);
      });
      div.appendChild(idiv);
    }
    nl.appendChild(div);
  });
}

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='d') navItem(1);
  if(e.key==='ArrowLeft'||e.key==='a') navItem(-1);
  if(e.key==='r'||e.key==='R') resetZ();
  if(e.key==='+'||e.key==='=') doZoom(1.3,null,null);
  if(e.key==='-') doZoom(1/1.3,null,null);
});

buildSidebar();
goTo(0);
</script>
</body>
</html>
