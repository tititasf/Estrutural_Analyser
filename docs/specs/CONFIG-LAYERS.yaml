# CONFIG-LAYERS.yaml — Configuração de Layers CAD-ANALYZER
# Fonte: dxf_reverso_analise.json + agente_estrutural.py
# Versão: 1.0.0 | Data: 2026-03-19
# Uso: normalizar layers de qualquer firma para canonical names
#
# Algoritmo de família (agente_estrutural._detect_family):
#   METHODUS → qualquer layer com prefixo "MTH-"
#   EBERICK  → >15% dos layers com prefixo "TX"
#   TQS      → >30% dos layers são numéricos (^\d+$)
#   BIM      → layers descritivos (CONCRETO, PAINEI, BEAM, etc.) — PADRÃO

meta:
  version: "1.0.0"
  date: "2026-03-19"
  total_layers_mapped: 85
  families: [BIM, TQS, METHODUS, EBERICK]
  encoding_note: |
    Arquivos DXF podem ser salvos em CP1252 (Windows) ou UTF-8.
    Layers com acentos (Painéis, Vázio, Demarcação) podem chegar corrompidos.
    Sempre normalizar com: unicodedata.normalize('NFKD', s).encode('ascii','ignore').decode().upper()

# ---------------------------------------------------------------------------
# DETECÇÃO DE FAMÍLIA
# ---------------------------------------------------------------------------
family_detection:
  METHODUS:
    rule: "any layer starts with 'MTH-'"
    example_layers: ["MTH-PILAR", "MTH-VIGA", "MTH-LAJE"]
  EBERICK:
    rule: ">15% of layers start with 'TX'"
    example_layers: ["TX_COL", "TX_BEAM", "TX_SLAB"]
  TQS:
    rule: ">30% of layers match /^\\d+$/"
    example_layers: ["1", "2", "3", "S-COLS", "S-BEAM"]
  BIM:
    rule: "any layer contains BIM keywords"
    keywords: [CONCRETO, PAINEI, BEAM, COLUMN, SLAB, PILAR, VIGA, LAJE, "F-", "S-"]
    default: true  # fallback para obras sem família clara

# ---------------------------------------------------------------------------
